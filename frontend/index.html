<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>VoiceBridge - Access</title>
</head>
<body>

  <!-- HEADER -->
  <header>
    <nav>
      <span>VoiceBridge</span>
    </nav>
  </header>



  <!-- MAIN CONTENT -->
  <main>
    <section id="access-section">
      <h1>Speak to your GP in your own language</h1>
      <p>Please enter your access code provided by the clinic staff to begin.</p>
      
      <form action="setup.html" method="GET">
        <label for="access-code">Access Code:</label><br>
        <input type="text" id="access-code" name="code" placeholder="Enter code..." required><br><br>
        <button type="submit">Start Appointment Setup</button>
      </form>
    </section>
  </main>



  <!-- FOOTER -->
  <footer>
    <p>This project is a prototype and is not medical advice.</p>
  </footer>

</body>
</html>
